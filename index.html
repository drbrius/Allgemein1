  <link rel="stylesheet" href="assets/style.css">
  <script>
    // Redirect returning visitors to their chosen language,
    // first-time visitors to their browser language.
    (function () {
      var supported = ["de", "en", "fr", "it"];
      var lang;
      try { lang = localStorage.getItem("calcmate-lang"); } catch (e) { /* blocked */ }
      if (!lang) {
        var nav = (navigator.language || "en").slice(0, 2).toLowerCase();
        if (supported.indexOf(nav) !== -1) lang = nav;
      }
      if (lang && supported.indexOf(lang) !== -1) {
        location.replace(lang + "/");
      }
    })();
  </script>
